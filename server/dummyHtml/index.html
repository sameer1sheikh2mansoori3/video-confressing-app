<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .my-message{
        background-color: gray;
      }
      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
      <input id="join_room" autocomplete="off"  /><button type="button" onclick="onclickHandler()">Join my room</button>
    </form>
  </body>
</html>
<!-- question : what is the purpose of this file? -->
<script src="/socket.io/socket.io.js"></script>
<script>
  let rooms= {};
  const socket = io();
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const roomName = document.getElementById('join_room');
  onclickHandler=()=>{
    alert("i am clicked\n");
    socket.emit("join-room" , roomName.value);
    rooms = roomName.value;
    roomName.value = '';

  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const mssg = input.value.trim();
    if (!mssg) return;

   
    
    // ye function keval room-message wale part ko hi message dega laude
    socket.emit('room-message', { room: rooms, text: mssg });

        

    input.value = '';
    
  });
// Room ke messages sunne ke liye
socket.on('message', (data) => {
  console.log('Room message:', data);

  // UI mein bhi dikhao
  const li = document.createElement('li');
  
  li.textContent = `[${data.from} ${data.text} ${data.room}]`;
  messages.appendChild(li);
  if (data.from === socket.id) {
    li.classList.add('my-message');   // ✅ apna message alag class
  }
});
</script>
